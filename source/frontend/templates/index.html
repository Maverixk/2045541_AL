<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mars IoT Dashboard</title>
    <!-- Using Bootstrap via CDN for a fast and clean design -->    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .bg-mars { background-color: #cd5c5c; color: white; }
        .sensor-warning { background-color: #ffc107 !important; }
        .actuator-card { text-align: center; }
        .actuator-ON { background-color: #d1e7dd; }
        .actuator-OFF { background-color: #f8d7da; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">🪐 Mars IoT Simulator Dashboard</span>
        <span class="navbar-text" id="connection-status">Connecting...</span>
    </div>
</nav>

<div class="container mt-4">

    <!-- Section 1: SENSORS -->
    <div class="row">
        <div class="col-12">
            <h3 class="mb-3">📡 Latest Sensor Metrics</h3>
        </div>
        <div id="sensors-container" class="row">
            <!-- Sensors will be injected here via JavaScript -->
        </div>
    </div>

    <hr class="my-4">

    <!-- Section 2: ACTUATORS -->
    <div class="row">
        <div class="col-12">
            <h3 class="mb-3">⚙️ Actuators Control</h3>
        </div>
        <div id="actuators-container" class="row">
            <!-- Actuators will be injected here via JavaScript -->
        </div>
    </div>

    <hr class="my-4">

    <!-- Section 3: AUTOMATION RULES -->
    <div class="row">
        <div class="col-12">
            <h3 class="mb-3">🤖 Automation Rules</h3>
        </div>

        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-mars">Active Rules</div>
                <ul class="list-group list-group-flush" id="rules-list">
                    <!-- Rule list via JS -->
                </ul>
            </div>
        </div>

        <!-- Add Rule Form -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-dark text-white">Add New Rule</div>
                <div class="card-body">
                    <form id="rule-form">
                        <div class="mb-2">
                            <label>Sensor ID</label>
                            <input type="text" class="form-control" id="form-sensor" placeholder="e.g. greenhouse_temperature" required>
                        </div>
                        <div class="mb-2">
                            <label>Metric</label>
                            <input type="text" class="form-control" id="form-metric" placeholder="e.g. temperature_c" required>
                        </div>
                        <div class="mb-2">
                            <label>Operator</label>
                            <select class="form-select" id="form-operator">
                                <option value="<"><</option>
                                <option value="<="><=</option>
                                <option value="=">=</option>
                                <option value=">">></option>
                                <option value=">=">>=</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label>Threshold Value</label>
                            <input type="number" step="0.01" class="form-control" id="form-threshold" required>
                        </div>
                        <div class="mb-2">
                            <label>Actuator target</label>
                            <input type="text" class="form-control" id="form-actuator" placeholder="e.g. cooling_fan" required>
                        </div>
                        <div class="mb-3">
                            <label>Action (Target State)</label>
                            <select class="form-select" id="form-state">
                                <option value="ON">ON</option>
                                <option value="OFF">OFF</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Rule</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Logic JS -->
<script>
    const REFRESH_RATE = 3000; // 3 seconds

    async function fetchDashboardData() {
        try {
            const response = await fetch('/api/dashboard-data');
            if (!response.ok) throw new Error('Network response was not ok');
            const data = await response.json();
            
            document.getElementById('connection-status').innerHTML = '✅ System Online';
            document.getElementById('connection-status').classList.replace('text-danger', 'text-success');

            renderSensors(data.sensors);
            renderActuators(data.actuators);
            renderRules(data.rules);

        } catch (error) {
            console.error('Error fetching data:', error);
            document.getElementById('connection-status').innerHTML = '❌ System Offline';
            document.getElementById('connection-status').classList.replace('text-success', 'text-danger');
        }
    }

    function renderSensors(sensors) {
        const container = document.getElementById('sensors-container');
        container.innerHTML = '';
        
        // Loop through each sensor
        for (const [sensor_id, metrics_obj] of Object.entries(sensors)) {
            // Loop through each metric inside that sensor
            for (const [metric_name, s_data] of Object.entries(metrics_obj)) {
                const isWarning = s_data.status === 'warning';
                const cardBg = isWarning ? 'sensor-warning' : 'bg-white';
                
                const cardHtml = `
                    <div class="col-md-3">
                        <div class="card ${cardBg}">
                            <div class="card-body">
                                <h6 class="card-title text-truncate" title="${sensor_id}">${sensor_id}</h6>
                                <h3 class="card-text">${parseFloat(s_data.value).toFixed(2)} <span class="fs-6">${s_data.unit}</span></h3>
                                <small class="text-muted">Metric: ${s_data.metric}</small><br>
                                <small class="text-muted">Last update: ${new Date(s_data.captured_at).toLocaleTimeString()}</small>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            }
        }
    }

    function renderActuators(actuators) {
        const container = document.getElementById('actuators-container');
        container.innerHTML = '';

        for (const [name, state] of Object.entries(actuators)) {
            const isON = state === 'ON';
            const btnClass = isON ? 'btn-danger' : 'btn-success';
            const actionText = isON ? 'Turn OFF' : 'Turn ON';
            const cardClass = isON ? 'actuator-ON' : 'actuator-OFF';

            const cardHtml = `
                <div class="col-md-3">
                    <div class="card actuator-card ${cardClass}">
                        <div class="card-body">
                            <h5 class="card-title text-capitalize">${name.replace('_', ' ')}</h5>
                            <h2 class="card-text">${state}</h2>
                            <button class="btn ${btnClass} mt-2" onclick="toggleActuator('${name}', '${isON ? 'OFF' : 'ON'}')">
                                ${actionText}
                            </button>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += cardHtml;
        }
    }

    function renderRules(rules) {
        const container = document.getElementById('rules-list');
        container.innerHTML = '';

        if (rules.length === 0) {
            container.innerHTML = '<li class="list-group-item text-muted">No automation rules defined.</li>';
            return;
        }

        rules.forEach(rule => {
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `
                <span>
                    <strong>IF</strong> ${rule.sensor_id} <em>[${rule.metric}]</em>
                    <span class="badge bg-secondary">${rule.operator}</span> 
                    ${rule.threshold_value} 
                    <strong>THEN SET</strong> ${rule.actuator_name} = 
                    <span class="badge ${rule.target_state === 'ON' ? 'bg-success' : 'bg-danger'}">${rule.target_state}</span>
                </span>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteRule(${rule.id})">Delete</button>
            `;
            container.appendChild(li);
        });
    }

    async function toggleActuator(actuator_name, target_state) {
        try {
            await fetch('/api/toggle-actuator', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ actuator_name, target_state })
            });
            fetchDashboardData(); 
        } catch (e) {
            alert('Failed to switch actuator');
        }
    }

    async function deleteRule(id) {
        if (!confirm('Are you sure you want to delete this rule?')) return;
        try {
            await fetch('/api/delete-rule/' + id, { method: 'DELETE' });
            fetchDashboardData();
        } catch (e) {
            alert('Failed to delete rule');
        }
    }

    document.getElementById('rule-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            sensor_id: document.getElementById('form-sensor').value,
            metric: document.getElementById('form-metric').value,
            operator: document.getElementById('form-operator').value,
            threshold_value: parseFloat(document.getElementById('form-threshold').value),
            actuator_name: document.getElementById('form-actuator').value,
            target_state: document.getElementById('form-state').value
        };

        try {
            const res = await fetch('/api/add-rule', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (!res.ok) {
                const errData = await res.json();
                alert('⚠️ Cannot save rule: ' + errData.detail);
                return;
            }
            
            e.target.reset(); // clear form
            fetchDashboardData();
        } catch (error) {
            alert('Error adding rule due to network or server crash.');
        }
    });

    // Start long-polling
    fetchDashboardData();
    setInterval(fetchDashboardData, REFRESH_RATE);

</script>
</body>
</html>
